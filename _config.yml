title: iFood Security Blog
name: iFood Security
email: security@ifood.com.br
description: >-
  Security engineering, research, and open-source insights from the teams
  protecting iFood at scale.
url: "https://blog.ifoodsecurity.com"
baseurl: ""
locale: en-US
lang: en-US
timezone: America/Sao_Paulo
repository: New-Horizons-Team/new-horizons-team.github.io

remote_theme: mmistakes/minimal-mistakes@4.27.3
minimal_mistakes_skin: default

plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-include-cache
  - jekyll-paginate
  - jekyll-redirect-from
  - jekyll-sitemap
  - jemoji

collections:
  topics:
    output: true
    permalink: /topics/:name/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      read_time: true
      author_profile: true
  - scope:
      path: ""
      type: topics
    values:
      layout: topic
      sitemap: true

logo: "/assets/img/ifood-logo-red.png"
og_image: "/assets/img/og-default.png"

social:
  type: Organization
  name: iFood Security
  links:
    - https://github.com/ifood
    - https://www.linkedin.com/company/ifood-/
    - https://www.instagram.com/ifooduniverso/

twitter:
  username: ifoodsecurity

google_analytics: G-T2VZWVS4VX

atom_feed:
  hide: false

footer:
  links:
    - label: Instagram
      icon: "fab fa-instagram"
      url: "https://www.instagram.com/ifooduniverso/"
    - label: LinkedIn
      icon: "fab fa-linkedin"
      url: "https://www.linkedin.com/company/ifood-/"
    - label: GitHub
      icon: "fab fa-github"
      url: "https://github.com/ifood"

exclude:
  - CHANGELOG.md
  - CLAUDE.md
  - CODEOWNERS
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/

include:
  - _pages

future: false
strict_front_matter: true
