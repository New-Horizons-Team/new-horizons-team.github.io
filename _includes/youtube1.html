<div class="embed-container">
  <iframe
    src="https://www.youtube-nocookie.com/embed/{{ include.id }}?cc_load_policy=1"
    title="{{ include.title | default: 'Embedded YouTube video' | escape }}"
    loading="lazy"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    allowfullscreen>
  </iframe>
</div>
<p class="video-note"><strong>Note:</strong> Watch on <a href="https://www.youtube.com/watch?v={{ include.id }}" target="_blank" rel="noopener noreferrer">YouTube</a> to access all available audio tracks and captions.</p>
