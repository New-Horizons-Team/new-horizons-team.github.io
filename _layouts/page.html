---
layout: default
---
<header class="page-hero">
  <div class="container page-hero__inner">
    {% if page.kicker %}<span class="section-kicker">{{ page.kicker }}</span>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p>{{ page.description }}</p>{% endif %}
  </div>
</header>
<div class="container page-content">
  {{ content }}
</div>
